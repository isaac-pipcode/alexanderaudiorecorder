# Blueprint do Render para o backend do YouTube Splitter.
# No Render: New > Blueprint > selecione este repositório.
# Ele lê este arquivo e cria o serviço já configurado.
services:
  - type: web
    name: alexanderaudiorecorder-backend
    runtime: docker
    # O Dockerfile e o contexto ficam na pasta backend/ (monorepo).
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Libera o CORS só para o site no Vercel. Ajuste se mudar o domínio.
      - key: ALLOWED_ORIGINS
        value: https://alexanderaudiotools.vercel.app
      # PUBLIC_BASE_URL é opcional: o backend usa RENDER_EXTERNAL_URL
      # automaticamente para montar os links de download.
